run_name: ppo_goal_belief_v2
seed: 7

env:
  max_steps: 120
  num_players: 4
  tick_size: 1.0
  base_spread: 2.0
  drift_std: 0.25
  external_fill_prob: 0.6
  external_order_flow_prob: 0.2
  goal_card_value: 10.0
  goal_majority_bonus: 40.0
  starting_cash: 350.0
  ante: 50.0
  pot_conserving_settlement: true
  quote_ttl_steps: 8
  include_belief_features: true
  include_goal_belief_features: true
  opponent_difficulties: [weak, average, bayesian]

train:
  total_timesteps: 120000
  n_envs: 4
  learning_rate: 0.0003
  n_steps: 256
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  eval_freq: 20000
  n_eval_episodes: 200
  deterministic_eval: true
  validation_seed: 50007

# Reserved final test: run once after checkpoint selection, never for tuning.
evaluation:
  test_seed: 700000
  test_episodes: 1000

paths:
  root_artifacts: artifacts
