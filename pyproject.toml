[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figgie-rl"
version = "0.1.0"
description = "Reinforcement-learning playground for a simplified Figgie market."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Figgie RL" }]
dependencies = [
  "gymnasium>=0.29.1",
  "numpy>=1.26",
  "PyYAML>=6.0.1",
  "rich>=13.7",
  "stable-baselines3>=2.3.2",
  "torch>=2.2",
  "tqdm>=4.66",
  "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.6.0",
  "setuptools>=77",
]

[project.scripts]
figgie-train = "figgie_rl.train.train_ppo:main"
figgie-eval = "figgie_rl.train.evaluate:main"
figgie-self-play = "figgie_rl.train.self_play:main"
figgie-demo = "figgie_rl.train.inspect_env:main"
figgie-arena = "figgie_play:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["figgie_rl*"]

[tool.setuptools]
py-modules = ["figgie_play"]

[tool.setuptools.package-data]
"figgie_rl.arena" = [
  "figgie_play.html",
  "figgie_arena.css",
  "figgie_arena.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
